[package]
name = "inactive-build-repro"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
exclude = ["vendor/optional-crate", "vendor/build-helper"]

[target.'cfg(target_os = "windows")'.dependencies]
optional-crate = { path = "vendor/optional-crate" }

[patch.crates-io]
build-helper = { path = "vendor/build-helper" }
