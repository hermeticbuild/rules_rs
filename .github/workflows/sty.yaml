name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: tamird/sty@3e6e9b0b54ce2455218b7634b9b89197f701041a
        with:
          audit-loads: true
          files: |
            rs/private/select_utils.bzl
            rs/private/select_render.bzl
            rs/private/all_crate_deps.bzl
            rs/private/cargo_toml_utils.bzl
            rs/private/semver.bzl
            rs/private/repository_utils.bzl
            rs/private/git_crate_metadata_repository.bzl
            rs/private/visibility.bzl
