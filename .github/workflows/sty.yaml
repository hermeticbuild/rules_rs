name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: List implementations in each Bazel workspace
        run: |
          git -c core.quotePath=false ls-files -- '*.bzl' ':(exclude)test/**' > "$RUNNER_TEMP/sty-root-files"
          git -C test -c core.quotePath=false ls-files -- '*.bzl' > "$RUNNER_TEMP/sty-test-files"
      - name: Use public Bazel downloads
        id: downloads
        run: sed -i '/^common --remote_cache=/d; /^common --experimental_remote_downloader=/d; /^common --bes_backend=/d' .bazelrc test/.bazelrc
      - name: Check test repository fixtures
        uses: &sty tamird/sty@2ab74c830937d3ca85165ca0e9a02a42400ad9e5
        with:
          working-directory: test
          artifact-name: sty-test
          advisory-files-from: ${{ runner.temp }}/sty-test-files
          audit-loads: true
          files: |
            external_path_dependency/source_repository.bzl
            verify_aliases.bzl
            visibility/repos.bzl
      - name: Locate generated Cargo workspace
        if: ${{ !cancelled() && steps.downloads.outcome == 'success' }}
        id: workspace
        shell: bash
        run: |
          location=$(bazel query --output=location '@rrra//:BUILD.bazel')
          hub="${location%/BUILD.bazel:*}"
          for file in data.bzl data.bzli defs.bzl; do
            if [[ ! -f "$hub/$file" ]]; then
              echo "Missing generated Cargo workspace file: $hub/$file" >&2
              exit 1
            fi
          done
          printf 'path=%s\n' "$hub" >> "$GITHUB_OUTPUT"
      - uses: *sty
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        with:
          advisory-files-from: ${{ runner.temp }}/sty-root-files
          audit-loads: true
          files: |
            rs/experimental/miri/private/providers.bzl
            rs/experimental/miri/private/toolchain.bzl
            rs/private/bindgen.bzl
            rs/private/select_utils.bzl
            rs/private/select_render.bzl
            rs/private/all_crate_deps.bzl
            rs/private/cargo_lints.bzl
            rs/private/cargo_toml_utils.bzl
            rs/private/cfg_parser.bzl
            rs/private/lint_flags.bzl
            rs/private/registry_utils.bzl
            rs/private/resolver.bzl
            rs/private/semver.bzl
            rs/private/repository_utils.bzl
            rs/private/bpf_linker_repository.bzl
            rs/private/git_crate_metadata_repository.bzl
            rs/private/host_cargo_repository.bzl
            rs/private/toolchain_labels_repository.bzl
            rs/private/toolchains_repository.bzl
            rs/private/visibility.bzl
            rs/toolchains/declare_bindgen_toolchains.bzl
            rs/toolchains/toolchain_config.bzl
            rs/toolchains/toolchain_utils.bzl
            rs/rules_rust_reexported_extensions.bzl
            rs/rules_rust_prost.bzl
            rs/rules_rust_pyo3.bzl
            rs/rules_rust_wasm_bindgen.bzl
            tools/rust_analyzer/defs.bzl
            ${{ steps.workspace.outputs.path }}/data.bzl
            ${{ steps.workspace.outputs.path }}/defs.bzl
